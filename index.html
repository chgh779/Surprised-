
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .btn {
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #ff4757;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .surprise-content {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .flash-bg {
            animation: flashBackground 0.6s infinite;
        }
        @keyframes flashBackground {
            0% { background-color: #121212; }
            50% { background-color: #8b0000; }
            100% { background-color: #121212; }
        }
        .emoji {
            font-size: 180px;
            user-select: none;
            animation: bounce 0.4s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }
        .text {
            color: white;
            font-size: 36px;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Initial Button -->
    <button class="btn" id="prankBtn">Click to Open Surprise 🎁</button>

    <!-- Hidden Surprise Content -->
    <div class="surprise-content" id="surpriseArea">
        <div class="emoji">🖕</div>
        <div class="text">Hahaha Surprise! 😂</div>
    </div>

    <!-- 100% Working Prank Evil Laugh Sound Link -->
    <audio id="prankAudio" src="https://google.com" loop preload="auto"></audio>

    <script>
        const btn = document.getElementById('prankBtn');
        const surpriseArea = document.getElementById('surpriseArea');
        const audio = document.getElementById('prankAudio');

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            surpriseArea.style.display = 'flex';
            document.body.classList.add('flash-bg');
            
            // Play sound with high volume
            audio.volume = 1.0;
            audio.play().catch(error => {
                console.log("Audio load issue:", error);
            });
        });
    </script>

</body>
</html>
